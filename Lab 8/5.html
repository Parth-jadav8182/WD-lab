<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .back {
            height: 100px;
            width: 100px;
            background-color: brown;
            animation: d 4s;
            animation-direction: reverse;
            position: relative;
        }

        @keyframes d {
             from{
                left: 0px;
                background-color: brown;
            }
            to{
                left: 200px;
                 background-color: rgb(198, 233, 58);
            }  
        }
    </style>
</head>

<body>
    <div class="back"></div>

</body>

</html>
