<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .back{
            height: 100px;
            width: 100px;
            background-color: brown;
            animation: d 10s;
            animation-iteration-count: infinite;
            position:relative;
        }
        @keyframes d {
           0%{
               left: 0px;
               top: 0px;
               
           }
            25%{
               left: calc(100vw - 110px);
               top: 0px;
               background-color: antiquewhite;
           }
            50%{
               left: calc(100vw - 110px);
               top: calc(100vh - 110px);
              background-color: rgb(200, 120, 15);
           }
            75%{
               left: 0px;
               top: calc(100vh - 110px);
              background-color: rgb(114, 45, 156);
           }
            100%{
               left: 0px;
               top: 0px;
                background-color: rgb(141, 211, 224);
           }
        }
            .dack{
            height: 100px;
            width: 100px;
            background-color: brown;
            animation: b 20s;
            animation-duration: 2s;
            animation-iteration-count: infinite;
            position:relative;
            }
        @keyframes b {
           0%{
               left: 0px;
               top: 0px;
               
           }
            25%{
               left: calc(100vw - 110px);
               top: 0px;
               background-color: antiquewhite;
           }
            50%{
               left: calc(100vw - 110px);
               top: calc(100vh - 110px);
              background-color: rgb(200, 120, 15);
           }
            75%{
               left: 0px;
               top: calc(100vh - 110px);
              background-color: rgb(114, 45, 156);
           }
            100%{
               left: 0px;
               top: 0px;
                background-color: rgb(141, 211, 224);
           }
           
        }
         .cack{
            height: 100px;
            width: 100px;
            background-color: brown;
            animation: c 25s;
            animation-duration: 3s;
            animation-iteration-count: infinite;
            position:relative;
            }
        @keyframes c {
           0%{
               left: 0px;
               top: 0px;
               
           }
            25%{
               left: calc(100vw - 110px);
               top: 0px;
               background-color: rgb(237, 138, 10);
           }
            50%{
               left: calc(100vw - 110px);
               top: calc(100vh - 110px);
              background-color: rgb(8, 104, 215);
           }
            75%{
               left: 0px;
               top: calc(100vh - 110px);
              background-color: rgb(114, 45, 156);
           }
            100%{
               left: 0px;
               top: 0px;
                background-color: rgb(210, 246, 8);
           }
           
        }
         .eack{
            height: 100px;
            width: 100px;
            background-color: brown;
            animation: e 30s;
            animation-duration: 4s;
            animation-iteration-count: infinite;
            position:relative;
            }
        @keyframes e {
           0%{
               left: 0px;
               top: 0px;
               
           }
            25%{
               left: calc(100vw - 110px);
               top: 0px;
               background-color: antiquewhite;
           }
            50%{
               left: calc(100vw - 110px);
               top: calc(100vh - 110px);
              background-color: rgb(234, 25, 77);
           }
            75%{
               left: 0px;
               top: calc(100vh - 110px);
              background-color: rgb(255, 162, 1);
           }
            100%{
               left: 0px;
               top: 0px;
                background-color: rgb(102, 19, 111);
           }
           
        }
        
        
    </style>
</head>
<body>
    <div class="back"> Hello</div>
    <div class="dack"> Hii</div>
    <div class="cack"> Majama</div>
    <div class="eack"> how are you</div>
    
</body>
</html>
