<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .back{
            height: 100px;
            width: 100px;
            background-color: brown;
            animation: d 4s;
            animation-iteration-count: infinite;
            position:relative;
             animation-iteration-count: infinite;
        }
        @keyframes d {
           0%{
               left: 0px;
               top: 0px;
               color: black;
               background-color: antiquewhite;
           }
            25%{
               left: 200px;
               top: 0px;
               color: rgb(240, 45, 45);
               background-color: rgb(200, 120, 15);
           }
            50%{
               left: 200px;
               top: 200px;
               color: rgb(83, 203, 27);
               background-color: rgb(114, 45, 156);
           }
            75%{
               left: 0px;
               top: 200px;
               color: rgb(108, 22, 230);
               background-color: rgb(215, 247, 250);
           }
            100%{
               left: 0px;
               top: 0px;
               color: rgb(97, 123, 218);
                background-color: rgb(149, 203, 13);
           }
           
        }
        
        
    </style>
</head>
<body>
    <div class="back"> Hello</div>
    
</body>
</html>
