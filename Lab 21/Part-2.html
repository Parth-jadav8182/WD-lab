
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background: white;
            color: black;
        }

        .pricing-card {
            background: #f1f1f1;
            border: 1px solid #ccc;
            transition: 0.4s;
        }

        .pricing-card:hover {
            transform: translateY(-12px);
            box-shadow: 0 10px 25px #0003;
            background: white;
            background-color: #c92f55;
            color: white;
        }

        .basic {
             background: #f1f1f1;
            border: 1px solid #ccc;
            transition: 0.4s;
        }

        .basic:hover {
             transform: translateY(-12px);
            box-shadow: 0 10px 25px #0003;
            background-color: #c92f55;
            color: white;
        }

        .pricing-btn {
            background: #e65378;
            color: white;
            border: none;
            transition: 0.3s;
        }

        .pricing-btn:hover {
            background: #ffcf00;
            
            transform: scale(1.08);
        }

        .basic-btn {
              background: #c92f55;
             color: white;
            border: none;
        }

        .basic-btn:hover {
            background: #ffcf00;
            color: black;
        }
    </style>
</head>

<body>

    <div class="container py-5">

        <!-- Heading -->
        <div class="text-center mb-5">
            <h2 class="fw-bold">Pricing Table</h2>
            <p class="text-secondary mt-3">
                Sample text. Lorem ipsum dolor sit amet, consectetur
                adipiscing elit, sed do eiusmod tempor incididunt.
            </p>
        </div>

        <!-- Pricing Cards -->
        <div class="row justify-content-center align-items-center g-4">

            <!-- Start -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="pricing-card text-center p-4 h-100">
                    <h3 class="fw-bold my-3">Start</h3>
                    <h4 class="fw-bold">Free</h4>

                    <p class="mt-4 mb-1">1 User</p>
                    <p>1 User</p>

                    <button class="btn pricing-btn mt-3 px-4">
                        Order Now
                    </button>
                </div>
            </div>

            <!-- Basic -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="pricing-card basic text-center p-4 h-100">
                    <h3 class="fw-bold my-3">Basic</h3>
                    <h4>$19.99</h4>

                    <p class="mt-4 mb-1">5 Users</p>
                    <p>5 Projects</p>

                    <button class="btn basic-btn mt-3 px-4">
                        Order Now
                    </button>
                </div>
            </div>

            <!-- Medium -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="pricing-card text-center p-4 h-100">
                    <h3 class="fw-bold my-3">Medium</h3>
                    <h4 class="fw-bold">$49.99</h4>

                    <p class="mt-4 mb-1">100 Users</p>
                    <p>100 Projects</p>

                    <button class="btn pricing-btn mt-3 px-4">
                        Order Now
                    </button>
                </div>
            </div>

            <!-- Expert -->
            <div class="col-12 col-sm-6 col-lg-3">
                <div class="pricing-card text-center p-4 h-100">
                    <h3 class="fw-bold my-3">Expert</h3>
                    <h4 class="fw-bold">$199.99</h4>

                    <p class="mt-4 mb-1">Unlimited Users</p>
                    <p>Unlimited Projects</p>

                    <button class="btn pricing-btn mt-3 px-4">
                        Order Now
                    </button>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
