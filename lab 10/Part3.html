<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: rgb(32, 32, 111);
    }

    div {
        height: 200px;
        width: 200px;
    }
    .a{
        display: flex;
        width: 100%;
         margin-top: 50px;
        justify-content: space-around;
    }

    .a1 {
        background: linear-gradient(45deg, red, yellow, green)
    }

    .a2 {
        background: linear-gradient(rgb(241, 187, 71), rgb(4, 171, 183))
    }
    .a3 {
        background: linear-gradient(45deg,rgb(241, 235, 71), rgb(70, 154, 200),rgb(187, 90, 196))
    }
     .b{
        display: flex;
        margin-top: 50px;
        width: 100%;
        justify-content: space-around;
    }

    .b1 {
        background: linear-gradient(90deg, rgb(241, 68, 123), rgb(162, 255, 0), rgb(73, 0, 128))
    }

    .b2 {
        background: linear-gradient(to left,rgb(116, 237, 209), rgb(4, 171, 183))
    }
    .b3 {
        background: linear-gradient(180deg,rgb(216, 118, 37), rgb(225, 128, 157),rgb(90, 196, 147))
    }
     .c{
        display: flex;
        width: 100%;
        margin-top: 50px;
        justify-content: space-around;
    }

    .c1 {
        background: linear-gradient(180deg, violet, yellow, green)
    }

    .c2 {
        background: radial-gradient(circle,rgb(211, 235, 77), rgb(148, 213, 96))
    }
    .c3 {
        background: linear-gradient(20deg,rgb(176, 71, 241), rgb(255, 182, 46),mistyrose)
    }
     .d{
        display: flex;
        width: 100%;
        margin-top: 50px;
        justify-content: space-around;
    }

    .d1 {
        background: linear-gradient(50deg, pink, rgb(141, 92, 190), rgb(212, 80, 142))
    }

    .d2 {
        background: radial-gradient(circle,rgb(211, 235, 77), rgb(148, 213, 96),gray)
    }
    .d3 {
        background: linear-gradient(20deg,rgb(176, 71, 241), rgb(255, 182, 46),mistyrose)
    }
     .e{
        display: flex;
        width: 100%;
        margin-top: 50px;
        justify-content: space-around;
    }

    .e1 {
        background: linear-gradient(180deg, violet, rgb(255, 0, 98), green)
    }

    .e2 {
        background: radial-gradient(circle,rgb(211, 235, 77), rgb(211, 89, 152),mistyrose)
    }
    .e3 {
        background: linear-gradient(20deg,rgb(224, 71, 241), rgb(255, 167, 3),mistyrose)
    }
     
</style>

<body>

    <div class="a">
        <div class="a1"></div>
        <div class="a2"></div>
        <div class="a3"></div>
    </div>
    <div class="b">
        <div class="b1"></div>
        <div class="b2"></div>
        <div class="b3"></div>
    </div>
    <div class="c">
        <div class="c1"></div>
        <div class="c2"></div>
        <div class="c3"></div>
    </div>
    <div class="d">
        <div class="d1"></div>
        <div class="d2"></div>
        <div class="d3"></div>
    </div>
    <div class="e">
        <div class="e1"></div>
        <div class="e2"></div>
        <div class="e3"></div>

    </div>

</body>

</html>
