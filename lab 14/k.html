<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundAMP</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
</head>
<STYle>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: black;
    font-family: Georgia, "Times New Roman", serif;
}

/* Main Header */
.navbar {
    height: 108px;
    width: 100%;
    background-color: black;

    display: flex;
    align-items: center;

    padding: 0 20px;

    border-bottom: 5px solid white;
}

/* Logo */
.logo {
    color: white;
    font-size: 25px;

    display: flex;
    align-items: center;
    gap: 12px;

    width: 30%;
}

.logo:first-letter {
    font-size: 40px;
}

.logo span {
    font-size: 25px;
}

/* Navigation */
.nav-links {
    display: flex;
    align-items: center;
    justify-content: center;

    gap: 35px;

    width: 50%;
}

/* Dropdown */
.nav-links select {
    background-color: black;
    color: white;

    border: none;

    font-size: 20px;
    font-weight: bold;

    padding: 5px;

    cursor: pointer;
}

/* Download button */
.download {
    text-decoration: none;

    color: white;
    background-color: cyan;

    font-size: 25px;

    padding: 5px 12px;

    border-radius: 30px;

    border: 3px solid white;
}

/* Social icons */
.social {
    width: 20%;

    display: flex;
    justify-content: flex-end;
    gap: 15px;
}

.social a {
    color: white;
    text-decoration: none;

    font-size: 20px;
    font-weight: bold;
}
</STYle>
<body>

    <header class="navbar">

        <!-- Logo + Name -->
        <div class="logo">
            🎸
            <span>SoundAMP</span>
        </div>

        <!-- Navigation -->
        <div class="nav-links">

            <select>
                <option>Html Template</option>
            </select>

            <select>
                <option>More Html Template</option>
            </select>

            <a href="#" class="download">Dowload</a>

        </div>

        <!-- Social Icons -->
        <div class="social">
            <a href="#">F</a>
            <a href="#">f</a>
            <a href="#">G</a>
            <a href="#">in</a>
            <a href="#">P</a>
            <a href="#">◎</a>
            <a href="#">♥</a>
        </div>

    </header>

</body>
</html>
