<!DOCTYPE html>
<html>

<head>
    <title>Student Rejectration Form </title>


</head>

<body bgcolor="mistyrose">
    <form>
        <table align="center" width="700" cellpadding="10">

            <tr>
                <td colspan="2" align="center">
                    <h1> Student Registration form </h1>
                </td>
            </tr>

            <tr>
                <td>
                    Full Name :
                </td>
                <td>
                    <input type="text" size="50" placeholder="Enter the Name" />


                </td>
            </tr>
            <tr>
                <td>
                    Email Id :
                </td>
                <td>
                    <input type="text" size="50" />


                </td>

            </tr>
            <tr>
                <td>
                    Mobile No :
                </td>
                <td>
                    <input type="text" size="1" value="+91" />
                    <input type="text" size="43" />


                </td>

            </tr>
            <tr>
                <td>
                    Address :
                </td>
                <td> <textarea cols="48" rows="5"> </textarea>



                </td>
            <tr>
                <td>
                    Nationality :
                </td>
                <td>
                    <input type="text" size="50" />


                </td>
            </tr>
            <tr>
                <td> Date Of Birth :</td>
                <td>
                    <input type="text" size="3" placeholder="Day" /> -
                    <input type="text" size="3" placeholder="Month" /> -
                    <input type="text" size="8" placeholder="Year" />
                    <i>(DD-MM-YYYY)</i>

                </td>
            </tr>
            <tr>
                <td>
                    Gender :
                </td>
                <td>
                    <input type="radio" name="g" /> Male
                    <input type="radio" name="g" /> female

                </td>
            </tr>
               <tr> 
                <td> Highest Digree :</td>
                <td> 
                    <select name="Digree">
                        <option value="B.tech">B.tech</option>
                        <option value="B.com">B.com</option>
                        <option value="BBA">BBA</option>
                        <option value="B.sci">B.sci</option>
                        <option value="Diploma">Diploma</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>
                    CPI :
                </td>
                <td>
                    <input type="text" size="50" />


                </td>
            </tr>
            <tr>
                <td>
                    University :
                </td>
                <td>
                    <input type="text" size="50" />


                </td>
            </tr>
            <tr>
                <td> Passing of the Year :</td>
                <td>

                    <input type="text" size="50" placeholder=" Passing of the Year" />


                </td>
            </tr>

            <tr>

                <td colspan="2" align="center">
                    <input type="submit" value="submit" />
                </td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="cancel" />
                </td>


            </tr> 
          





        </table>

    </form>





</html>
</body>
