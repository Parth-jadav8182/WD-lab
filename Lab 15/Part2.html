<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-..." crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif, Tahoma, Geneva, Verdana, sans-serif, 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif, 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif, Tahoma, Geneva, Verdana, sans-serif;
            height: 100%;
            display: flex;
            justify-content: center;
        }

        a {
            text-decoration: none;
        }

        .container {
            height: 700px;
            width: 1000px;
            /* border: 1px solid black; */
            background: radial-gradient(ellipse at 35% -20%, lightblue 5%, #E8F0F2 30%, #D9BDB9 50%, transparent 75%),
                linear-gradient(to top, #E8F0F2 10%, #D9BDB9 40%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .whole {
            height: 600px;
            width: 875px;
            background-color: white;
            position: relative;
            display: flex;

        }

        .left {
            background-color: #F7F7F7;
            width: 50%;
            height: 100%;
        }

        .left img {
            margin: 10% 10%;
        }

        .icons {
            margin: 5% 0 0 5%;
        }

        .box {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 60px;
            width: 775px;
            top: 99%;
            margin: -11.5% 7%;
            position: absolute;
            background-color: white;
            border-radius: 5px;
            box-shadow: 0 0 5px rgba(128, 128, 128, 0.463);
            /* z-index: ; */
        }

        .insidebox {
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* border: 1px solid black; */
            height: 40px;
            width: 700px;
        }

        .leftpart {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .leftpart img {
            border: 1px solid rgba(128, 128, 128, 0.285);
            border-radius: 5px;
        }

        .middlepart {
            margin-left: -80px;
        }

        .rightpart {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            /* margin-right: 50px; */
        }

        .ac {
            height: 30px;
            width: 150px;
            font-size: x-small;
            background-color: rgb(0, 0, 133);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 3px;
        }

        .noti {
            height: 11px;
            width: 17px;
            /* border: 1px solid black; */
            border-radius: 5px;
            color: white;
            background-color: #09b6aa;
            position: absolute;
            top: 90%;
            left: 3.5%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .right {
            width: 50%;
        }

        .gap {
            margin: 5% 5% 0 5%;
            font-size: x-small;
        }

        .star {
            color: gold;
            font-size: xx-small;
        }

        .notstar {
            font-size: xx-small;
            color: rgba(128, 128, 128, 0.373);
        }

        .rating {
            font-size: xx-small;
        }

        h4 {
            margin: 4% 0 2% 0;
        }

        .options {
            box-sizing: border-box;
            border: 1px solid rgba(128, 128, 128, 0.256);
            display: flex;
            width: 180px;
            border-radius: 3px;
        }

        .basic,
        .premium,
        .option {
            font-size: xx-small;
            width: 90px;
            height: 20px;
            align-items: center;
            display: flex;
            justify-content: center;
        }

        .premium {
            background-color: rgba(128, 128, 128, 0.093);
        }

        .styles {
            display: flex;
            justify-content: space-between;
            width: 325px;
            /* border: 1px solid black; */
        }

        .style {
            display: flex;
            justify-content: space-between;
            width: 155px;
            /* border: 1px solid black; */
        }

        .colors {
            display: flex;
            justify-content: space-between;
            width: 105px;
            /* border: 1px solid black; */
        }

        .option {
            border: 1px solid rgba(128, 128, 128, 0.182);
            width: 70px;
            border-radius: 20px;
        }

        .color {
            height: 15px;
            width: 15px;
            border: 1px solid rgba(128, 128, 128, 0.175);
            border-radius: 20px;
        }

        h5 {
            margin: 0 0 3% 0;
        }

        .sec {
            display: flex;
            font-size: x-small;
            justify-content: space-evenly;
            gap: 40px;
            margin: 4% 15% 0 4%;
        }

        .sec p {
            margin-bottom: 3%;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, blue 33%, gray 33%);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="whole">
            <div class="left">
                <i class="fa-solid fa-bars icons"></i> <br>
                <i class="fa-solid fa-magnifying-glass icons"></i>
                <img src="https://i.pinimg.com/1200x/d5/26/82/d5268259bf30d3e81432ab24aa725672.jpg" alt="bedroom college essentials" height="" width="350px">
                <i class="fa-regular fa-user icons"></i> <br>
                <i class="fa-regular fa-envelope icons"></i>
                <div class="noti" style="font-size: xx-small;">12</div>
            </div>

            <div class="right">
                <div class="gap">
                    <a href="">
                        <p style="color: rgb(0, 0, 154);">← Back to bedroom</p>
                    </a>
                    <!-- 27 -->
                    <p style="color: rgba(128, 128, 128, 0.677); margin: 5% 0 1% 0;">BEDROOM</p>
                    <p style="font-size: medium; font-weight: 700; margin: 1% 0 2% 0;">College Essentials</p>
                    <i class="fa-solid fa-star star"></i>
                    <i class="fa-solid fa-star star"></i>
                    <i class="fa-solid fa-star star"></i>
                    <i class="fa-solid fa-star star"></i>
                    <i class="fa-solid fa-star notstar"></i>
                    <span class="rating">&nbsp;&nbsp;4.4 (328 reviews)</span>
                    <h4>Select Quality</h4>
                    <div class="options">
                        <div class="basic">Basic</div>
                        <div class="premium">Premium</div>
                    </div>
                    <h4 style="margin: 4% 0 2% 0;">Style</h4>
                    <div class="styles">
                        <div class="option">Minimal</div>
                        <div class="option">Bohemian</div>
                        <div class="option">Floral</div>
                        <div class="option">Other</div>
                    </div>
                    <h4>Color</h4>
                    <div class="colors">
                        <div class="color" style="background-color: #29D3C7;"></div>
                        <div class="color" style="background-color: black;"></div>
                        <div class="color" style="background-color: rgba(128, 128, 128, 0.207);"></div>
                        <div class="color"></div>
                    </div>
                    <h4>Size</h4>
                    <div class="style">
                        <div class="option">Twin XL</div>
                        <div class="option">Full</div>
                    </div>
                </div>

                <div class="sec">
                    <div class="what">
                        <p>What's Inside</p>
                    </div>
                    <div class="reviews">
                        <p>Reviews</p>
                    </div>
                    <div class="faqs">
                        <p>FAQs</p>
                    </div>
                </div>
                <hr style="width: 85%; margin-left: 25px;">
            </div>

            <div class="box">
                <div class="insidebox">
                    <div class="leftpart">
                        <div class="part1">
                            <img src="https://i.pinimg.com/1200x/d5/26/82/d5268259bf30d3e81432ab24aa725672.jpg" alt="image of bed essentials" height="35px"
                                width="37px" style="margin-top: 10%;">
                        </div>
                        <div class="part2">
                            <h5>College Essentials</h5>
                            <p style="font-size: x-small; margin: 0; color: gray;">Everything you need for freshman
                                year.</p>
                        </div>
                    </div>
                    <div class="middlepart">
                        <h5 margin>Add Ons</h5>
                        <i class="fa-regular fa-square-plus"
                            style="color: rgba(128, 128, 128, 0.268); margin-left: 10%; font-size: x-large;"></i>
                    </div>
                    <div class="rightpart">
                        <p>$195</p>
                        <div class="ac">Add to Cart (2)</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
